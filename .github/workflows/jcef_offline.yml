          #     fi

      # Install jre MacOS arm64
      # - name: Install Jre MacOS arm64
      #   if: ${{ runner.os == 'macOS' && matrix.arch == 'arm64' }}
      #   uses: actions/setup-java@main
      #   with:
      #     java-version: '17'
      #     distribution: 'temurin'
      #     java-package: 'jre'
      #     architecture: 'aarch64'



      - name: Setup Custom JBR for Linux Runtime Image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            JBR_URL="https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-17.0.12-linux-aarch64-b1207.37.tar.gz"
          else
            JBR_URL="https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-17.0.12-linux-x64-b1207.37.tar.gz"
          fi

          echo "Downloading Linux JBR JCEF for ${{ matrix.arch }}..."
          curl -L -o jbr-linux.tar.gz "$JBR_URL"
          mkdir -p jbr-linux
          tar -xzf jbr-linux.tar.gz -C jbr-linux --strip-components=1

          JBR_HOME_PATH=$(cd jbr-linux && pwd)
          echo "JBR_LINUX_PATH=$JBR_HOME_PATH" >> "$GITHUB_ENV"
          echo "Linux JBR JCEF is ready at: $JBR_HOME_PATH"

      - name: Install Ubuntu packaging dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot zip rpm cpio desktop-file-utils file libsecret-1-dev

      # java.security open tls1 Windows
      - name: Enable tls1
        if: ${{ runner.os == 'Windows' }}
        # 在这个步骤中，临时覆盖 JAVA_HOME，让 Maven 使用 JBR
        env:
          JAVA_HOME: ${{ env.JBR_BUILD_PATH }}
        run: |
          # sed -i '' "s/\(^jdk.tls.disabledAlgorithms=\)\(.*\)\( TLSv1, TLSv1.1,\)\(.*\)/\1\2\4/" "${{ env.JAVA_HOME }}/conf/security/java.security"
          $filePath = "${{ env.JAVA_HOME }}\conf\security\java.security"
          $content = Get-Content $filePath -Raw
          $updatedContent = $content -replace '(?s)(jdk.tls.disabledAlgorithms\s*=\s*)(.*?)(\s*TLSv1,\s*TLSv1\.1,)(.*?)(?=[,\r\n])', '$1$2$4'

          $updatedContent | Set-Content $filePath
          Write-Output "Original content:"
          Write-Output $content

          # 打印修改后的内容确认替换是否生效
          Write-Output "Updated content:"
          Write-Output $updatedContent

        shell: pwsh

      # java.security open tls1 macOS
      - name: Enable tls1
        if: ${{ runner.os == 'macOS' }}
        run: |
          sed -i '' "s/\(^jdk.tls.disabledAlgorithms=\)\(.*\)\( TLSv1, TLSv1.1,\)\(.*\)/\1\2\4/" "$JAVA_HOME/conf/security/java.security"

      # Copy jre Windows
      - name: Copy Jre for Windows
        if: ${{ runner.os == 'Windows' }}
        # 在这个步骤中，临时覆盖 JAVA_HOME，让 Maven 使用 JBR
        shell: pwsh
        env:
          JAVA_HOME: ${{ env.JBR_BUILD_PATH }}
        run: |
          $runtime = Join-Path $env:JCEF_PROJECT_ROOT "jpackage/input/runtime/win/Home"
          New-Item -Path $runtime -ItemType Directory -Force | Out-Null
          Copy-Item -Path "$env:JAVA_HOME\*" -Destination $runtime -Recurse -Force
          Get-ChildItem -Path $runtime | Select-Object -First 20

      # Copy jre macOS
      - name: Copy Jre for macOS arm64
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$JAVA_HOME"
          mkdir -p "${JCEF_STATIC_PATH}"
          rm -rf "${JCEF_JRE_PATH}"
          cp -R "$JAVA_HOME" "${JCEF_JRE_PATH}"
          chmod -R 777 "${JCEF_JRE_PATH}"
          rm -rf "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/mac"
          mkdir -p "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/mac"
          cp -R "$JAVA_HOME/../.."/* "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/mac"
          test -d "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/mac/Contents/Home/lib"
          find "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/mac" -maxdepth 3 -type d | sort | head -20
          chmod -R 777 "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/mac"
          mkdir -p "${JCEF_PROJECT_ROOT}/jpackage/input/mac"
          rm -rf "${JCEF_PROJECT_ROOT}/jpackage/input/mac/Frameworks"
          cp -R "$JAVA_HOME/../Frameworks" "${JCEF_PROJECT_ROOT}/jpackage/input/mac"
          rm -rf "${JCEF_PROJECT_ROOT}/jpackage/input/mac/Frameworks/cef_server.app"
      

      # Copy jre Linux
      - name: Copy Jre for Linux
        if: ${{ runner.os == 'Linux' }}
        env:
          JAVA_HOME: ${{ env.JBR_LINUX_PATH }}
        run: |
          mkdir -p "${JCEF_STATIC_PATH}"
          cp -r "$JAVA_HOME" "${JCEF_JRE_PATH}"
          chmod -R 777 "${JCEF_JRE_PATH}"
          mkdir -p "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/linux/Home"
          cp -r "$JAVA_HOME"/* "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/linux/Home"
          chmod -R 777 "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/linux"

      # Linux
      - name: Delete File
        if: ${{ runner.os == 'Linux' }}
        run: |
          cd "${JCEF_JRE_PATH}"
          ls -la
          rm -rf legal
          ls -la
          rm -rf "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/linux/Home/legal"

      - name: Setup Temurin JDK for Linux Build and Packaging
        if: ${{ runner.os == 'Linux' }}
        uses: actions/setup-java@main
        with:
          java-version: '17'
          distribution: 'temurin'
          java-package: 'jdk'

      - name: Enable tls1
        if: ${{ runner.os == 'Linux' }}
        run: |
          sed -i "s/\(^jdk.tls.disabledAlgorithms=\)\(.*\)\( TLSv1, TLSv1.1,\)\(.*\)/\1\2\4/" "$JAVA_HOME/conf/security/java.security"

      # 安装Node.js
      - name: Install Node.js
        uses: actions/setup-node@main
        with:
          node-version: '22.22.2'
          cache: 'yarn'
          cache-dependency-path: ${{ env.JCEF_YARN_LOCK_PATH }}

        # 安装Maven
        # - name: Install Java and Maven
        #   uses: actions/setup-java@main
        #   with:
        #     java-version: '17'
        #     distribution: 'temurin'
        #     cache: 'maven'

      - name: Install community artifacts win
        if: ${{ runner.os == 'Windows' }}
        env:
          JAVA_HOME: ${{ env.JBR_BUILD_PATH }}
        run: |
          mvn -v
          mvn clean install -U -B '-Dmaven.test.skip=true' -f ${{ env.JCEF_COMMUNITY_POM_PATH }}

      - name: Install community artifacts mac
        if: ${{ runner.os == 'macOS' }}
        run: |
          mvn -v
          mvn clean install -U -B '-Dmaven.test.skip=true' -f ${{ env.JCEF_COMMUNITY_POM_PATH }}

      - name: Install community artifacts linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          mvn -v
          mvn clean install -U -B '-Dmaven.test.skip=true' -f ${{ env.JCEF_COMMUNITY_POM_PATH }}

      # 设置OSS
      - name: Set up oss utils
        if: ${{ !(runner.os == 'Linux' && matrix.arch == 'arm64') }}
        uses: yizhoumo/setup-ossutil@v1
        with:
          endpoint: ${{ secrets.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          ossutil-version: '1.7.16'

      - name: Set up oss utils for Linux arm64
        if: ${{ runner.os == 'Linux' && matrix.arch == 'arm64' }}
        shell: bash
        run: |
          set -euo pipefail
          OSSUTIL_PATH="$RUNNER_TEMP/ossutil"
          curl -L -o "$OSSUTIL_PATH" "https://gosspublic.alicdn.com/ossutil/1.7.16/ossutilarm64"
          chmod 755 "$OSSUTIL_PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$OSSUTIL_PATH" config --endpoint "${{ secrets.OSS_ENDPOINT }}" --access-key-id "${{ secrets.OSS_ACCESS_KEY_ID }}" --access-key-secret "${{ secrets.OSS_ACCESS_KEY_SECRET }}"

      # 打包后端工程
      - name: Build BE Static win
        if: ${{ runner.os == 'Windows' }}
        # 在这个步骤中，临时覆盖 JAVA_HOME，让 Maven 使用 JBR
        shell: pwsh
        env:
          JAVA_HOME: ${{ env.JBR_BUILD_PATH }}
        run: |
          pwd
          mvn -v 
          mvn clean install -U -B '-Dmaven.test.skip=true' `
            "-P${env:CHAT2DB_MAVEN_PROFILE}" `
            "-Dchat2db.update.key-id=${env:CHAT2DB_UPDATE_KEY_ID}" `
            "-Dchat2db.update.public-key=${env:CHAT2DB_UPDATE_PUBLIC_KEY_B64}" `
            -f "${env:JCEF_POM_PATH}"
          # ossutil cp -rf ${{ secrets.REPO_JAR_PATH }} "oss://${{ secrets.BUCKET_NAME }}/offline/updates/${{ github.event.inputs.version }}/"
          # cp ${{ secrets.REPO_JAR_PATH }} ${{ secrets.REPO_STATIC_JAR_PATH }} 

      # 打包后端工程
      - name: Build BE Static mac
        if: ${{ runner.os == 'macOS' }}
        run: |
          pwd
          mvn -v 
          mvn clean install -U -B '-Dmaven.test.skip=true' \
            -P"${CHAT2DB_MAVEN_PROFILE}" \
            -Dchat2db.update.key-id="${CHAT2DB_UPDATE_KEY_ID}" \
            -Dchat2db.update.public-key="${CHAT2DB_UPDATE_PUBLIC_KEY_B64}" \
            -f "${JCEF_POM_PATH}"
          # ossutil cp -rf ${{ secrets.REPO_JAR_PATH }} "oss://${{ secrets.BUCKET_NAME }}/offline/updates/${{ github.event.inputs.version }}/"
          # cp ${{ secrets.REPO_JAR_PATH }} ${{ secrets.REPO_STATIC_JAR_PATH }}

      - name: Build BE Static linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          pwd
          mvn -v
          mvn clean install -U -B '-Dmaven.test.skip=true' \
            -P"${CHAT2DB_MAVEN_PROFILE}" \
            -Dchat2db.update.key-id="${CHAT2DB_UPDATE_KEY_ID}" \
            -Dchat2db.update.public-key="${CHAT2DB_UPDATE_PUBLIC_KEY_B64}" \
            -f "${JCEF_POM_PATH}"
          # ossutil cp -rf ${{ secrets.REPO_JAR_PATH }} "oss://${{ secrets.BUCKET_NAME }}/offline/updates/${{ github.event.inputs.version }}/"
          # cp ${{ secrets.REPO_JAR_PATH }} ${{ secrets.REPO_STATIC_JAR_PATH }}
      

      # 打包前端资源
      - name: Build FE Static
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export CHAT2DB_FRONTEND_SRC_ROOT="${JCEF_FRONTEND_SRC_ROOT}"
          export CHAT2DB_PRODUCT_CONFIG="${JCEF_PRODUCT_CONFIG}"

          pushd ${{ env.JCEF_FRONT_PATH }}
          yarn install --frozen-lockfile --non-interactive
          yarn run modify:package:name chat2db-local Chat2DB-Local
          yarn run build:web:offline --app_version=${{ github.event.inputs.version }}
          rm -f dist.zip
          zip -qr dist.zip dist
          
          cp -r dist ./static/
          
          popd
          echo "Returned to the original directory. Current path is:"
          pwd
          
          bash "${JCEF_PACKAGE_SCRIPT_DIR}/prepare_desktop_layout.sh" \
            "${{ github.event.inputs.version }}" \
            "${JCEF_FRONT_PATH}/dist" \
            "${CHAT2DB_RELEASE_EPOCH}" \
            "${JCEF_ENTERPRISE_SOURCE_REF}" \
            "${JCEF_PROJECT_ROOT}"

          if [ "${CHAT2DB_MAVEN_PROFILE}" = "bridge-fat" ]; then
            mkdir -p "${JCEF_PROJECT_ROOT}/jpackage/input/sourceFile"
            cp "${JCEF_FRONT_PATH}/dist.zip" "${JCEF_PROJECT_ROOT}/jpackage/input/sourceFile/dist.zip"
            test -f "${JCEF_PROJECT_ROOT}/jpackage/input/sourceFile/chat2db-enterprise.jar"
            test ! -e "${JCEF_PROJECT_ROOT}/jpackage/input/sourceFile/chat2db-studio.jar"
            CHAT2DB_PACKAGE_EDITION="local" \
            CHAT2DB_PACKAGE_MODE="enterprise-over-community" \
            CHAT2DB_SOURCE_REF="${JCEF_SOURCE_REF}" \
            CHAT2DB_ENTERPRISE_SOURCE_REF="${JCEF_ENTERPRISE_SOURCE_REF}" \
            CHAT2DB_COMMUNITY_SOURCE_REF="${JCEF_COMMUNITY_SOURCE_REF}" \
              bash "${JCEF_PACKAGE_SCRIPT_DIR}/generate_metadata.sh" \
                "${{ github.event.inputs.version }}" \
                "${JCEF_PROJECT_ROOT}/jpackage/input/sourceFile" \
                https://cdn.chat2db-ai.com/offline/updates
            cp "${JCEF_PROJECT_ROOT}/jpackage/input/sourceFile/version.json" \
              "${JCEF_PROJECT_ROOT}/jpackage/input/sourceFile/local_version.json"
            for platform in mac win linux; do
              cp "${JCEF_PROJECT_ROOT}/jpackage/input/sourceFile/local_version.json" \
                "${JCEF_PROJECT_ROOT}/jpackage/input/${platform}/local_version.json"
            done
          fi
      

      # Step specifically for Windows
      - name: Build FE Static (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          FRONT_PATH="$(cygpath -u "${JCEF_FRONT_PATH}")"
          PROJECT_ROOT="$(cygpath -u "${JCEF_PROJECT_ROOT}")"
          PACKAGE_SCRIPT_DIR="$(cygpath -u "${JCEF_PACKAGE_SCRIPT_DIR}")"
          FRONTEND_SRC_ROOT="$(cygpath -u "${JCEF_FRONTEND_SRC_ROOT}")"
          PRODUCT_CONFIG="$(cygpath -u "${JCEF_PRODUCT_CONFIG}")"
          export CHAT2DB_FRONTEND_SRC_ROOT="$FRONTEND_SRC_ROOT"
          export CHAT2DB_PRODUCT_CONFIG="$PRODUCT_CONFIG"

          pushd "$FRONT_PATH"
          yarn install --frozen-lockfile --non-interactive
          yarn run modify:package:name chat2db-local Chat2DB-Local
          yarn run build:web:offline --app_version=${{ github.event.inputs.version }}
          
          # 【已修改】在 Windows 上，使用 7-Zip 创建标准的 zip 文件，避免编码问题
          # 7-Zip is pre-installed on GitHub's Windows runners
          7z a -tzip dist.zip ./dist
          
          cp -r dist ./static/
          popd
          
          echo "Returned to the original directory. Current path is:"
          pwd
          
          bash "$PACKAGE_SCRIPT_DIR/prepare_desktop_layout.sh" \
            "${{ github.event.inputs.version }}" \
            "$FRONT_PATH/dist" \
            "$CHAT2DB_RELEASE_EPOCH" \
            "$JCEF_ENTERPRISE_SOURCE_REF" \
            "$PROJECT_ROOT"

          if [ "$CHAT2DB_MAVEN_PROFILE" = "bridge-fat" ]; then
            mkdir -p "$PROJECT_ROOT/jpackage/input/sourceFile"
            cp "$FRONT_PATH/dist.zip" "$PROJECT_ROOT/jpackage/input/sourceFile/dist.zip"
            test -f "$PROJECT_ROOT/jpackage/input/sourceFile/chat2db-enterprise.jar"
            test ! -e "$PROJECT_ROOT/jpackage/input/sourceFile/chat2db-studio.jar"
            CHAT2DB_PACKAGE_EDITION="local" \
            CHAT2DB_PACKAGE_MODE="enterprise-over-community" \
            CHAT2DB_SOURCE_REF="${JCEF_SOURCE_REF}" \
            CHAT2DB_ENTERPRISE_SOURCE_REF="${JCEF_ENTERPRISE_SOURCE_REF}" \
            CHAT2DB_COMMUNITY_SOURCE_REF="${JCEF_COMMUNITY_SOURCE_REF}" \
              bash "$PACKAGE_SCRIPT_DIR/generate_metadata.sh" \
                "${{ github.event.inputs.version }}" \
                "$PROJECT_ROOT/jpackage/input/sourceFile" \
                https://cdn.chat2db-ai.com/offline/updates
            cp "$PROJECT_ROOT/jpackage/input/sourceFile/version.json" \
              "$PROJECT_ROOT/jpackage/input/sourceFile/local_version.json"
            for platform in mac win linux; do
              cp "$PROJECT_ROOT/jpackage/input/sourceFile/local_version.json" \
                "$PROJECT_ROOT/jpackage/input/$platform/local_version.json"
            done
          fi

      - name: Restore Windows runtime image after build clean
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JAVA_HOME: ${{ env.JBR_BUILD_PATH }}
        run: |
          $runtime = Join-Path $env:JCEF_PROJECT_ROOT "jpackage/input/runtime/win/Home"
          if (Test-Path $runtime) {
            Remove-Item -Path $runtime -Recurse -Force
          }
          New-Item -Path $runtime -ItemType Directory -Force | Out-Null
          Copy-Item -Path "$env:JAVA_HOME\*" -Destination $runtime -Recurse -Force
          $jvmCfg = Join-Path $runtime "lib\jvm.cfg"
          if (-not (Test-Path $jvmCfg)) {
            throw "runtime image missing $jvmCfg"
          }

      - name: Restore macOS runtime image after build clean
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/mac"
          mkdir -p "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/mac"
          cp -R "$JAVA_HOME/../.."/* "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/mac"
          test -d "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/mac/Contents/Home/lib"
          chmod -R 777 "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/mac"
          mkdir -p "${JCEF_PROJECT_ROOT}/jpackage/input/mac"
          rm -rf "${JCEF_PROJECT_ROOT}/jpackage/input/mac/Frameworks"
          cp -R "$JAVA_HOME/../Frameworks" "${JCEF_PROJECT_ROOT}/jpackage/input/mac"
          rm -rf "${JCEF_PROJECT_ROOT}/jpackage/input/mac/Frameworks/cef_server.app"

      - name: Restore Linux runtime image after build clean
        if: runner.os == 'Linux'
        shell: bash
        env:
          JAVA_HOME: ${{ env.JBR_LINUX_PATH }}
        run: |
          set -euo pipefail
          rm -rf "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/linux/Home"
          mkdir -p "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/linux/Home"
          cp -R "$JAVA_HOME"/* "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/linux/Home"
          rm -rf "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/linux/Home/legal"
          test -x "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/linux/Home/bin/java"
          chmod -R 777 "${JCEF_PROJECT_ROOT}/jpackage/input/runtime/linux"

      - name: Upload build provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-provenance-${{ matrix.os }}-${{ matrix.file_name }}
          path: ${{ env.JCEF_PROJECT_ROOT }}/jpackage/input/sourceFile/build-provenance.json
          if-no-files-found: warn

      - name: Import Code-Signing Certificate
        if: ${{ runner.os == 'macOS' }}
        run: |
          echo "${{ secrets.MAC_CERTS }}" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "${{ secrets.MAC_CERTS_PASSWORD }}" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "${{ secrets.MAC_CERTS_PASSWORD }}" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.MAC_CERTS_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.MAC_CERTS_PASSWORD }}" "$KEYCHAIN_PATH"
          echo "Certificate and key successfully installed."

      - name: Sign native Mach-O payloads inside JARs
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/cicd-packaging-source/.github/scripts/sign-macos-native-libraries.sh" \
            "${JCEF_PROJECT_ROOT}/jpackage/input/mac"

      - name: Setup Temurin JDK (for jpackage)
        if: runner.os == 'macOS'
        id: setup_temurin_mac
        uses: actions/setup-java@main
        with:
          java-version: '17'
          distribution: 'temurin'
          java-package: 'jdk'
          architecture: ${{ matrix.arch == 'x86_64' && 'x64' || 'aarch64' }}

      # =================================================================
      # 【第三阶段】在打包前，将环境切换到 Temurin
      # =================================================================
      - name: Switch to Temurin JDK for Packaging
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Switching active Java environment to Temurin for jpackage..."

          # actions/setup-java 会在后续 step 中直接设置 JAVA_HOME，这里优先使用它。
          TEMURIN_PATH="${JAVA_HOME:-}"
          if [ -z "$TEMURIN_PATH" ] && command -v java >/dev/null 2>&1; then
            JAVA_BIN="$(command -v java)"
            TEMURIN_PATH="$(cd "$(dirname "$JAVA_BIN")/.." && pwd)"
          fi

          echo "Found Temurin JDK path: $TEMURIN_PATH"
          if [ -z "$TEMURIN_PATH" ]; then
            echo "::error::Temurin JDK path is empty."
            exit 1
          fi

          # 覆盖 GITHUB_ENV 和 GITHUB_PATH，让后续步骤使用 Temurin
          echo "JAVA_HOME=$TEMURIN_PATH" >> "$GITHUB_ENV"
          echo "$TEMURIN_PATH/bin" >> "$GITHUB_PATH"
          echo "Environment switched. Subsequent steps will use Temurin JDK."
          echo "Temurin java path: $TEMURIN_PATH/bin/java"
          "$TEMURIN_PATH/bin/java" -version
          "$TEMURIN_PATH/bin/jpackage" --version


      - name: package mac arm64
        if: ${{ runner.os == 'macOS' && matrix.arch == 'arm64' }}
        run: |
          bash ${{ env.JCEF_PACKAGE_SCRIPT_DIR }}/package_macos_offline.sh  ${{ github.event.inputs.version }} "" "${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}-arm64.dmg"

      - name: package mac x86_64
        if: ${{ runner.os == 'macOS' && matrix.arch == 'x86_64' }}
        run: |
          bash ${{ env.JCEF_PACKAGE_SCRIPT_DIR }}/package_macos_offline.sh  ${{ github.event.inputs.version }} "" "${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}-x64.dmg"

      - name: package linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          bash ${{ env.JCEF_PACKAGE_SCRIPT_DIR }}/package_linux_offline.sh ${{ github.event.inputs.version }}

      - name: Notarize macOS package
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          MAC_APPLE_PASSWORD: ${{ secrets.MAC_APPLE_PASSWORD }}
          MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            arm64)
              PACKAGE_FILE="${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}-arm64.dmg"
              PACKAGE_PLATFORM="macOS arm64"
              ;;
            x86_64)
              PACKAGE_FILE="${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}-x64.dmg"
              PACKAGE_PLATFORM="macOS x64"
              ;;
            *)
              echo "Unexpected macOS architecture: ${{ matrix.arch }}" >&2
              exit 1
              ;;
          esac
          DMG_PATH="${JCEF_PROJECT_ROOT}/jpackage/output/${PACKAGE_FILE}"
          test -s "${DMG_PATH}"

          submit_result="${RUNNER_TEMP}/notary-submit.json"
          wait_result="${RUNNER_TEMP}/notary-wait.json"
          submit_exit=0
          xcrun notarytool submit "${DMG_PATH}" \
            --apple-id "${MAC_APPLE_ID}" \
            --password "${MAC_APPLE_PASSWORD}" \
            --team-id "${MAC_TEAM_ID}" \
            --no-wait \
            --output-format json > "${submit_result}" || submit_exit=$?
          cat "${submit_result}"
          submission_id=$(/usr/bin/plutil -extract id raw -expect string -o - "${submit_result}" 2>/dev/null || true)
          if [ "${submit_exit}" -ne 0 ] || [ -z "${submission_id}" ]; then
            echo "Apple notarization submission failed: submission=${submission_id:-unknown}" >&2
            exit 1
          fi

          wait_exit=1
          for attempt in 1 2 3; do
            : > "${wait_result}"
            wait_exit=0
            xcrun notarytool wait "${submission_id}" \
              --apple-id "${MAC_APPLE_ID}" \
              --password "${MAC_APPLE_PASSWORD}" \
              --team-id "${MAC_TEAM_ID}" \
              --timeout 25m \
              --output-format json > "${wait_result}" || wait_exit=$?
            if [ "${wait_exit}" -eq 0 ]; then
              break
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Apple notarization status lookup failed; retrying ${submission_id} (${attempt}/3)." >&2
              sleep 15
            fi
          done
          cat "${wait_result}"
          notary_status=$(/usr/bin/plutil -extract status raw -expect string -o - "${wait_result}" 2>/dev/null || true)
          if [ "${wait_exit}" -ne 0 ] || [ "${notary_status}" != "Accepted" ]; then
            echo "Apple notarization failed: status=${notary_status:-unknown}, submission=${submission_id}" >&2
            xcrun notarytool log "${submission_id}" \
              --apple-id "${MAC_APPLE_ID}" \
              --password "${MAC_APPLE_PASSWORD}" \
              --team-id "${MAC_TEAM_ID}" || true
            exit 1
          fi

          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
          ossutil cp -rf "${DMG_PATH}" "oss://${{ secrets.BUCKET_NAME }}/offline/${{ github.event.inputs.version }}/"
          FEISHU_WEBHOOK_URL="${{ secrets.FEISHU_RELEASE_NOTIFY_WEBHOOK }}" \
            PACKAGE_EDITION="Chat2DB Local" \
            PACKAGE_VERSION="${{ github.event.inputs.version }}" \
            PACKAGE_PLATFORM="${PACKAGE_PLATFORM}" \
            PACKAGE_NAME="${PACKAGE_FILE}" \
            PACKAGE_URL="https://cdn.chat2db-ai.com/offline/${{ github.event.inputs.version }}/${PACKAGE_FILE}" \
            python3 "${RUNNER_TEMP}/notify_package.py"
          echo "oss successful"

      - name: Upload Linux packages to OSS
        if: ${{ runner.os == 'Linux' }}
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            DEB_FILE="${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}-arm64.deb"
            RPM_FILE="${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}-aarch64.rpm"
            APPIMAGE_FILE="${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}-arm64.AppImage"
          else
            DEB_FILE="${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}-amd64.deb"
            RPM_FILE="${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}-x86_64.rpm"
            APPIMAGE_FILE="${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}-x86_64.AppImage"
          fi

          notify_package() {
            local platform="$1"
            local package_file="$2"
            FEISHU_WEBHOOK_URL="${{ secrets.FEISHU_RELEASE_NOTIFY_WEBHOOK }}" \
              PACKAGE_EDITION="Chat2DB Local" \
              PACKAGE_VERSION="${{ github.event.inputs.version }}" \
              PACKAGE_PLATFORM="$platform" \
              PACKAGE_NAME="$package_file" \
              PACKAGE_URL="https://cdn.chat2db-ai.com/offline/${{ github.event.inputs.version }}/$package_file" \
              python3 "$RUNNER_TEMP/notify_package.py"
          }

          echo "上传 Linux 离线版本产物到 OSS..."
          ossutil cp -rf "${{ env.JCEF_PROJECT_ROOT }}/jpackage/output/${DEB_FILE}" "oss://${{ secrets.BUCKET_NAME }}/offline/${{ github.event.inputs.version }}/"
          notify_package "Linux ${{ matrix.arch }} deb" "$DEB_FILE"
          ossutil cp -rf "${{ env.JCEF_PROJECT_ROOT }}/jpackage/output/${RPM_FILE}" "oss://${{ secrets.BUCKET_NAME }}/offline/${{ github.event.inputs.version }}/"
          notify_package "Linux ${{ matrix.arch }} rpm" "$RPM_FILE"
          ossutil cp -rf "${{ env.JCEF_PROJECT_ROOT }}/jpackage/output/${APPIMAGE_FILE}" "oss://${{ secrets.BUCKET_NAME }}/offline/${{ github.event.inputs.version }}/"
          notify_package "Linux ${{ matrix.arch }} AppImage" "$APPIMAGE_FILE"

      - name: Install WinSCP
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install winscp -y --no-progress

          $candidates = @(
            "C:\Program Files (x86)\WinSCP\WinSCP.com",
            "C:\Program Files\WinSCP\WinSCP.com",
            "C:\ProgramData\chocolatey\bin\winscp.com"
          )

          $winScpPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $winScpPath) {
            Write-Error "WinSCP.com was not found after installation."
            exit 1
          }

          $winScpDir = Split-Path -Path $winScpPath -Parent
          "WINSCP_PATH=$winScpPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $winScpDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Resolved WinSCP executable: $winScpPath"

      - name: package win x64
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_SCRIPT_DIR="$(cygpath -u "${JCEF_PACKAGE_SCRIPT_DIR}")"
          OPENJDK_UNIX="$(cygpath -u "${OPENJDK_PATH}")"
          export JAVA_HOME="$OPENJDK_UNIX"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          jpackage --version
          bash "$PACKAGE_SCRIPT_DIR/package_win_offline.sh" "${{ github.event.inputs.version }}"

      # ==============================================================
      # Windows installer: sign MSI -> wrap in Inno Setup EXE -> sign EXE
      # (Chat2DB Local / offline edition)
      #
      # Background: jpackage's --type exe wraps an unsigned MSI inside a
      # bootstrap EXE. On SRP/AppLocker-managed machines this triggers
      # MSI error 1718 / exit code 1625. Fix = sign both layers.
      # ==============================================================

      - name: Install Inno Setup
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $isccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $isccPath) {
            Write-Error "ISCC.exe was not found after Inno Setup installation."
            exit 1
          }
          Write-Host "Resolved ISCC: $isccPath"

      # ---- Sign the inner MSI on the remote signing server ----

      - name: Upload unsigned MSI to OSS staging
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cygpath -u "${JCEF_PROJECT_ROOT}")"
          ossutil cp -rf "$PROJECT_ROOT/jpackage/output/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.msi" "oss://${{ secrets.BUCKET_NAME }}/offline/updates/${{ github.event.inputs.version }}/temp-msi/"

      - name: Sign MSI on remote signing server
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 15
        shell: pwsh
        env:
          SCP_PASSWORD: ${{ secrets.WIN_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.WIN_SERVER_IP }}
          REMOTE_USER: ${{ secrets.WIN_SERVER_USER }}
          REMOTE_MSI_PATH: '${{ secrets.REMOTE_SIGN_PATH }}/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.msi'
          REMOTE_OSS: ${{ secrets.REMOTE_SIGN_SCRIPT_OSS }}
          SIGN_MSI_SHA1: '${{ secrets.REMOTE_SIGN_SCRIPT }} --alg SHA-1 ${{ secrets.REMOTE_SIGN_PATH }}/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.msi'
          SIGN_MSI_SHA256: '${{ secrets.REMOTE_SIGN_SCRIPT }} --alg SHA-256 ${{ secrets.REMOTE_SIGN_PATH }}/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.msi'
        run: |
          & "${env:WINSCP_PATH}" /log=winscp-msi.log /command `
            "option batch abort" `
            "option confirm off" `
            "open scp://${{ env.REMOTE_USER }}:${{ env.SCP_PASSWORD }}@${{ env.REMOTE_HOST }} -hostkey=*" `
            "call ${{ env.REMOTE_OSS }} oss://${{ secrets.BUCKET_NAME }}/offline/updates/${{ github.event.inputs.version }}/temp-msi/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.msi ${env:REMOTE_MSI_PATH}" `
            "call ${env:SIGN_MSI_SHA1}" `
            "call ${env:SIGN_MSI_SHA256}" `
            "call ${{ env.REMOTE_OSS }} ${env:REMOTE_MSI_PATH} oss://${{ secrets.BUCKET_NAME }}/offline/updates/${{ github.event.inputs.version }}/signed-msi/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.msi " `
            "exit"

      - name: Download signed MSI from OSS
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cygpath -u "${JCEF_PROJECT_ROOT}")"
          ossutil cp -rf "oss://${{ secrets.BUCKET_NAME }}/offline/updates/${{ github.event.inputs.version }}/signed-msi/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.msi" "$PROJECT_ROOT/jpackage/output/"

      # ---- Wrap the signed MSI in an Inno Setup EXE (still unsigned outer) ----

      - name: Wrap signed MSI with Inno Setup
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_SCRIPT_DIR="$(cygpath -u "${JCEF_PACKAGE_SCRIPT_DIR}")"
          bash "$PACKAGE_SCRIPT_DIR/wrap_win_installer.sh" "${{ github.event.inputs.version }}" local

      # ---- Sign the outer EXE (existing flow, now operates on the wrapped EXE) ----

      # 准备发往OSS的文件
      - name: Prepare upload for OSS
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cygpath -u "${JCEF_PROJECT_ROOT}")"
          FRONT_PATH="$(cygpath -u "${JCEF_FRONT_PATH}")"
          WORKSPACE_PATH="$(cygpath -u "${GITHUB_WORKSPACE}")"
          pwd
          mkdir -p "$FRONT_PATH/release"
          cp -r "$PROJECT_ROOT/jpackage/output/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.exe" "$FRONT_PATH/release"
          ls "$FRONT_PATH/release"
          cp -r "$FRONT_PATH/release/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.exe" "$WORKSPACE_PATH"

      # 上传文件到OSS准备
      - name: Upload to OSS for windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE_PATH="$(cygpath -u "${GITHUB_WORKSPACE}")"
          ossutil cp -rf "$WORKSPACE_PATH/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.exe" "oss://${{ secrets.BUCKET_NAME }}/offline/updates/${{ github.event.inputs.version }}/temp/"

      # 上传文件到远程服务器
      - name: Copy files to remote server
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 15
        shell: pwsh
        env:
          SCP_PASSWORD: ${{ secrets.WIN_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.WIN_SERVER_IP }}
          REMOTE_USER: ${{ secrets.WIN_SERVER_USER }}
          REMOTE_PATH: '${{ secrets.REMOTE_SIGN_PATH }}/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.exe'
          REMOTE_OSS: ${{ secrets.REMOTE_SIGN_SCRIPT_OSS }}
          HOST_KEY: ${{ secrets.HOST_KEY }}
          FILE_TO_UPLOAD: '${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.exe'
          REMOTE_SCRIPT_PATH_1: '${{ secrets.REMOTE_SIGN_SCRIPT }} --alg SHA-1 ${{ secrets.REMOTE_SIGN_PATH }}/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.exe'
          REMOTE_SCRIPT_PATH_2: '${{ secrets.REMOTE_SIGN_SCRIPT }} --alg SHA-256 ${{ secrets.REMOTE_SIGN_PATH }}/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.exe'
          LOCAL_DOWNLOAD_PATH: '${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.exe'
        run: |
          & "${env:WINSCP_PATH}" /log=winscp.log /command `
            "option batch abort" `
            "option confirm off" `
            "open scp://${{ env.REMOTE_USER }}:${{ env.SCP_PASSWORD }}@${{ env.REMOTE_HOST }} -hostkey=*" `
            "call ${{ env.REMOTE_OSS }} oss://${{ secrets.BUCKET_NAME }}/offline/updates/${{ github.event.inputs.version }}/temp/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.exe ${env:REMOTE_PATH}" `
            "call ${env:REMOTE_SCRIPT_PATH_1}" `
            "call ${env:REMOTE_SCRIPT_PATH_2}" `
            "call ${{ env.REMOTE_OSS }} ${env:REMOTE_PATH} oss://${{ secrets.BUCKET_NAME }}/offline/${{ github.event.inputs.version }}/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.exe " `
            "exit"

      # 拉取OSS文件
      - name: Prepare upload for OSS on windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          ossutil cp -rf oss://${{ secrets.BUCKET_NAME }}/offline/${{ github.event.inputs.version }}/${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.exe ${{ env.JCEF_PROJECT_ROOT }}/jpackage/output/
          $packageFile = "${{ secrets.OFFLINE_PRODUCT_APP_NAME }}-${{ github.event.inputs.version }}.exe"
          $env:FEISHU_WEBHOOK_URL = "${{ secrets.FEISHU_RELEASE_NOTIFY_WEBHOOK }}"
          $env:PACKAGE_EDITION = "Chat2DB Local"
          $env:PACKAGE_VERSION = "${{ github.event.inputs.version }}"
          $env:PACKAGE_PLATFORM = "Windows x64"
          $env:PACKAGE_NAME = $packageFile
          $env:PACKAGE_URL = "https://cdn.chat2db-ai.com/offline/${{ github.event.inputs.version }}/$packageFile"
          python "$env:RUNNER_TEMP/notify_package.py"

      - name: Archive updater-v2 full package
        if: ${{ github.event.inputs.publish_mode != 'v1' && (env.CHAT2DB_MAVEN_PROFILE == 'versioned-thin' || env.CHAT2DB_RELEASE_CHANNEL == 'BETA' || github.event.inputs.version != '5.3.3') && startsWith(matrix.update_target, 'macos-') }}
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH=$(find "${JCEF_PROJECT_ROOT}/jpackage/output" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "${DMG_PATH}"
          bash "${JCEF_PROJECT_ROOT}/script/package/capture_macos_update_package.sh" \
            "${DMG_PATH}" \
            "${JCEF_PROJECT_ROOT}/jpackage/output/update-package" \
            "${JCEF_PROJECT_ROOT}"
          test -d "${JCEF_PROJECT_ROOT}/jpackage/output/update-package"
          PACKAGE_ROOT="${RUNNER_TEMP}/full-package-${{ matrix.update_target }}"
          rm -rf "${PACKAGE_ROOT}"
          mkdir -p "${PACKAGE_ROOT}/package"
          cp -R "${JCEF_PROJECT_ROOT}/jpackage/output/update-package/." "${PACKAGE_ROOT}/package/"
          tar -C "${PACKAGE_ROOT}" -czf \
            "${RUNNER_TEMP}/full-package-${{ matrix.update_target }}.tar.gz" \
            package

      - name: Upload updater-v2 full package artifact
        if: ${{ github.event.inputs.publish_mode != 'v1' && (env.CHAT2DB_MAVEN_PROFILE == 'versioned-thin' || env.CHAT2DB_RELEASE_CHANNEL == 'BETA' || github.event.inputs.version != '5.3.3') && startsWith(matrix.update_target, 'macos-') }}
        uses: actions/upload-artifact@v4
        with:
          name: full-package-local-${{ matrix.update_target }}
          path: ${{ runner.temp }}/full-package-${{ matrix.update_target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Archive legacy bridge update payload
        if: ${{ runner.os == 'Windows' && github.event.inputs.publish_mode != 'v2' && env.CHAT2DB_MAVEN_PROFILE == 'bridge-fat' && env.CHAT2DB_RELEASE_CHANNEL == 'STABLE' }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cygpath -u "${JCEF_PROJECT_ROOT}")"
          RUNNER_TEMP_UNIX="$(cygpath -u "${RUNNER_TEMP}")"
          SOURCE_DIR="${PROJECT_ROOT}/jpackage/input/sourceFile"
          test -s "${SOURCE_DIR}/version.json"
          test -s "${SOURCE_DIR}/chat2db-enterprise.jar"
          test -s "${SOURCE_DIR}/chat2db-updater.jar"
          test -s "${SOURCE_DIR}/dist.zip"
          test ! -e "${SOURCE_DIR}/lib.zip"
          tar -C "${SOURCE_DIR}" -czf "${RUNNER_TEMP_UNIX}/bridge-update.tar.gz" \
            version.json build-provenance.json chat2db-enterprise.jar chat2db-updater.jar dist.zip

      - name: Upload legacy bridge update payload artifact
        if: ${{ runner.os == 'Windows' && github.event.inputs.publish_mode != 'v2' && env.CHAT2DB_MAVEN_PROFILE == 'bridge-fat' && env.CHAT2DB_RELEASE_CHANNEL == 'STABLE' }}
        uses: actions/upload-artifact@v4
        with:
          name: bridge-update-local
          path: ${{ runner.temp }}/bridge-update.tar.gz
          if-no-files-found: error
          retention-days: 7

  promote:
    name: Promote Local desktop release
    runs-on: ubuntu-latest
    needs:
      - resolve_source
      - release
    steps:
      - name: Check out Enterprise source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REPO_URL }}
          path: enterprise-source
          ref: ${{ needs.resolve_source.outputs.enterprise_sha }}
          token: ${{ secrets.ACCESS_TOKEN }}
          persist-credentials: false

      - name: Check out CI promotion helpers
        uses: actions/checkout@v4
        with:
          path: cicd-promotion-source
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download legacy bridge update payload
        if: ${{ github.event.inputs.publish_mode != 'v2' && needs.resolve_source.outputs.release_profile == 'bridge-fat' && needs.resolve_source.outputs.release_channel_upper == 'STABLE' }}
        uses: actions/download-artifact@v4
        with:
          name: bridge-update-local
          path: ${{ runner.temp }}/update-artifacts/bridge-update-local

      - name: Download updater-v2 full packages
        if: ${{ github.event.inputs.publish_mode != 'v1' && (needs.resolve_source.outputs.release_profile == 'versioned-thin' || needs.resolve_source.outputs.release_channel_upper == 'BETA' || github.event.inputs.version != '5.3.3') }}
        uses: actions/download-artifact@v4
        with:
          pattern: full-package-local-*
          path: ${{ runner.temp }}/update-artifacts
          merge-multiple: false

      - name: Set up OSS client
        uses: yizhoumo/setup-ossutil@v1
        with:
          endpoint: ${{ secrets.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          ossutil-version: '1.7.16'

      - name: Set up R2 client
        shell: bash
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "${R2_ACCESS_KEY}"
          test -n "${R2_SECRET_KEY}"
          test -n "${R2_ENDPOINT}"
          test -n "${R2_BUCKET_NAME}"
          sudo apt-get update
          sudo apt-get install -y jq rclone zip
          RCLONE_CONFIG_PATH="${RUNNER_TEMP}/rclone.conf"
          printf '%s\n' \
            '[cf-r2]' \
            'type = s3' \
            'provider = Cloudflare' \
            "access_key_id = ${R2_ACCESS_KEY}" \
            "secret_access_key = ${R2_SECRET_KEY}" \
            "endpoint = ${R2_ENDPOINT}" \
            'acl = private' > "${RCLONE_CONFIG_PATH}"
          echo "RCLONE_CONFIG=${RCLONE_CONFIG_PATH}" >> "${GITHUB_ENV}"
          echo "R2_REMOTE=cf-r2:${R2_BUCKET_NAME}" >> "${GITHUB_ENV}"

      - name: Set up atomic download-server upload
        shell: bash
        env:
          DOWNLOAD_SERVER_HOST: ${{ secrets.DOWNLOAD_SERVER_HOST }}
          DOWNLOAD_SERVER_USER: ${{ secrets.DOWNLOAD_SERVER_USER }}
          DOWNLOAD_SERVER_SSH_KEY: ${{ secrets.DOWNLOAD_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${DOWNLOAD_SERVER_HOST}"
          test -n "${DOWNLOAD_SERVER_USER}"
          test -n "${DOWNLOAD_SERVER_SSH_KEY}"
          mkdir -p "${HOME}/.ssh"
          KEY_PATH="${HOME}/.ssh/download_server_id"
          printf '%s\n' "${DOWNLOAD_SERVER_SSH_KEY}" > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          ssh-keyscan -H "${DOWNLOAD_SERVER_HOST}" >> "${HOME}/.ssh/known_hosts" 2>/dev/null
          ssh -i "${KEY_PATH}" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${DOWNLOAD_SERVER_USER}@${DOWNLOAD_SERVER_HOST}" "echo download server connected"
          {
            echo "DOWNLOAD_SERVER_HOST=${DOWNLOAD_SERVER_HOST}"
            echo "DOWNLOAD_SERVER_USER=${DOWNLOAD_SERVER_USER}"
            echo "DOWNLOAD_SERVER_KEY=${KEY_PATH}"
          } >> "${GITHUB_ENV}"

      - name: Promote immutable resources and mutable pointers
        shell: bash
        env:
          CHAT2DB_PRODUCT: LOCAL
          CHAT2DB_RELEASE_ROOT: offline
          CHAT2DB_PRODUCT_APP_NAME: ${{ secrets.OFFLINE_PRODUCT_APP_NAME }}
          CHAT2DB_RELEASE_VERSION: ${{ github.event.inputs.version }}
          CHAT2DB_RELEASE_PROFILE: ${{ needs.resolve_source.outputs.release_profile }}
          CHAT2DB_PUBLISH_MODE: ${{ github.event.inputs.publish_mode }}
          CHAT2DB_RELEASE_CHANNEL: ${{ needs.resolve_source.outputs.release_channel_upper }}
          CHAT2DB_RELEASE_EPOCH: ${{ github.event.inputs.release_epoch }}
          CHAT2DB_ENTERPRISE_SHA: ${{ needs.resolve_source.outputs.enterprise_sha }}
          CHAT2DB_RELEASE_NOTES_URL: ${{ github.event.inputs.release_notes_url }}
          CHAT2DB_ENTERPRISE_ROOT: ${{ github.workspace }}/enterprise-source
          CHAT2DB_UPDATE_ARTIFACT_ROOT: ${{ runner.temp }}/update-artifacts
          CHAT2DB_PROMOTE_WORK_DIR: ${{ runner.temp }}
          CHAT2DB_UPLOAD_LATEST: ${{ github.event.inputs.upload_latest }}
          CHAT2DB_UPDATE_LATEST_VERSION_JSON: ${{ github.event.inputs.update_latest_version_json }}
          CHAT2DB_UPDATE_KEY_ID: ${{ secrets.CHAT2DB_UPDATE_KEY_ID }}
          CHAT2DB_UPDATE_PUBLIC_KEY_B64: ${{ secrets.CHAT2DB_UPDATE_PUBLIC_KEY_B64 }}
          CHAT2DB_UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.CHAT2DB_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: |
          bash "${GITHUB_WORKSPACE}/cicd-promotion-source/.github/scripts/promote-desktop-release.sh"

  notify_summary:
    name: Notify Feishu release summary
    runs-on: ubuntu-latest
    needs:
      - release
      - promote
    if: ${{ always() }}
    steps:
      - name: Send Feishu package summary
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_NOTIFY_WEBHOOK }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          RELEASE_RESULT: ${{ needs.release.result }}
          PROMOTION_RESULT: ${{ needs.promote.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_RELEASE_NOTIFY_WEBHOOK is not configured; skip summary notification."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          version = os.environ["RELEASE_VERSION"]
          result = os.environ["RELEASE_RESULT"]
          promotion_result = os.environ["PROMOTION_RESULT"]
          run_url = os.environ["RUN_URL"]
          base = f"https://cdn.chat2db-ai.com/offline/{version}"
          files = [
              f"Chat2DB-Local-{version}.exe",
              f"Chat2DB-Local-{version}-x64.dmg",
              f"Chat2DB-Local-{version}-arm64.dmg",
              f"Chat2DB-Local-{version}-x86_64.AppImage",
              f"Chat2DB-Local-{version}-arm64.AppImage",
              f"Chat2DB-Local-{version}-amd64.deb",
              f"Chat2DB-Local-{version}-arm64.deb",
              f"Chat2DB-Local-{version}-x86_64.rpm",
              f"Chat2DB-Local-{version}-aarch64.rpm",
          ]

          def failed_release_jobs():
              repo = os.environ["GITHUB_REPOSITORY"]
              run_id = os.environ["GITHUB_RUN_ID"]
              token = os.environ.get("GITHUB_TOKEN", "")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100",
                  headers={
                      "Accept": "application/vnd.github.v3+json",
                      "Authorization": f"Bearer {token}",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      jobs = json.loads(response.read().decode("utf-8")).get("jobs", [])
              except Exception as exc:
                  return [f"- 无法读取失败 job 列表：{exc}"]

              failed = []
              for job in jobs:
                  name = job.get("name", "")
                  if not (name.startswith("release ") or name.startswith("Promote ")):
                      continue
                  conclusion = job.get("conclusion") or job.get("status") or "unknown"
                  if conclusion != "success":
                      failed.append(f"- {name}: {conclusion}")
              return failed or ["- 未获取到失败 job，请查看运行链接"]

          if result == "success" and promotion_result == "success":
              lines = [
                  "Chat2DB Local 灰度包全部上传成功",
                  f"版本：{version}",
                  "下载链接：",
                  *[f"- {base}/{name}" for name in files],
                  f"运行链接：{run_url}",
              ]
          else:
              lines = [
                  "Chat2DB Local 灰度打包未全部成功",
                  f"版本：{version}",
                  f"结果：{result}",
                  f"发布结果：{promotion_result}",
                  "失败/未成功 job：",
                  *failed_release_jobs(),
                  f"运行链接：{run_url}",
              ]

          payload = json.dumps(
              {"msg_type": "text", "content": {"text": "\n".join(lines)}},
              ensure_ascii=False,
          ).encode("utf-8")
          request = urllib.request.Request(
              os.environ["FEISHU_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(response.read().decode("utf-8"))
          except urllib.error.URLError as exc:
              print(f"::warning::Feishu summary notification failed: {exc}")
          PY
