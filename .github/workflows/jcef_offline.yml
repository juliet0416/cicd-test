name: Build jcef_Offline Client

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      version:
        description: 'Version number'
        required: true
        default: '1.0.0'
      publish_mode:
        description: 'Release metadata to publish'
        required: false
        default: 'both'
        type: choice
        options:
          - v1
          - v2
          - both
      source_ref:
        description: 'Chat2DB source branch/ref; empty uses REPO_BRANCH secret'
        required: false
        default: ''
      upload_latest:
        description: '是否上传到 latest 目录 (true/false)'
        required: false   # 设为非必须
        default: 'false'  # 提供一个默认值
        type: string
      update_latest_version_json:
        description: '是否在全部平台成功后发布自动更新指针 (true/false)'
        required: false
        default: 'false'
        type: string
      channel:
        description: '自动更新通道'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      release_epoch:
        description: '单调递增的更新发布序号；5.3.3 使用 0'
        required: true
        default: '0'
        type: string
      release_notes_url:
        description: 'HTTPS release notes URL'
        required: true
        default: 'https://chat2db.ai/release-notes'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resolve_source:
    name: Resolve Enterprise and Community source commits
    runs-on: ubuntu-latest
    outputs:
      enterprise_sha: ${{ steps.resolve.outputs.enterprise_sha }}
      community_sha: ${{ steps.resolve.outputs.community_sha }}
      release_profile: ${{ steps.release_contract.outputs.release_profile }}
      release_channel_upper: ${{ steps.release_contract.outputs.release_channel_upper }}
    steps:
      - name: Check out Enterprise source ref
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REPO_URL }}
          path: enterprise-source
          ref: ${{ github.event.inputs.source_ref || secrets.REPO_BRANCH }}
          token: ${{ secrets.ACCESS_TOKEN }}
          persist-credentials: false

      - name: Resolve source commits
        id: resolve
        shell: bash
        env:
          REQUESTED_SOURCE_REF: ${{ github.event.inputs.source_ref || secrets.REPO_BRANCH }}
        run: |
          set -euo pipefail
          enterprise_root="${GITHUB_WORKSPACE}/enterprise-source"
          community_ref_file="${enterprise_root}/.chat2db-community-ref"
          enterprise_sha="$(git -C "${enterprise_root}" rev-parse HEAD)"
          test -f "${community_ref_file}"
          community_sha="$(tr -d '[:space:]' < "${community_ref_file}")"
          if [[ ! "${enterprise_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid Enterprise source SHA: ${enterprise_sha}"
            exit 1
          fi
          if [[ ! "${community_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.chat2db-community-ref must contain one 40-character lowercase SHA"
            exit 1
          fi
          echo "enterprise_sha=${enterprise_sha}" >> "${GITHUB_OUTPUT}"
          echo "community_sha=${community_sha}" >> "${GITHUB_OUTPUT}"
          echo "requested Enterprise ref: ${REQUESTED_SOURCE_REF}"
          echo "resolved Enterprise SHA: ${enterprise_sha}"
          echo "declared Community SHA: ${community_sha}"

      - name: Verify Community source commit
        uses: actions/checkout@v4
        with:
          repository: OtterMind/Chat2DB
          path: community-source
          ref: ${{ steps.resolve.outputs.community_sha }}
          persist-credentials: false

      - name: Check out CI packaging helpers
        uses: actions/checkout@v4
        with:
          path: cicd-packaging-source
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate desktop release contract
        id: release_contract
        shell: bash
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/cicd-packaging-source/.github/scripts/resolve-desktop-release.py" \
            --version "${{ github.event.inputs.version }}" \
            --channel "${{ github.event.inputs.channel }}" \
            --release-epoch "${{ github.event.inputs.release_epoch }}" \
            --release-notes-url "${{ github.event.inputs.release_notes_url }}" \
            >> "${GITHUB_OUTPUT}"

      - name: Test desktop release contract
        run: |
          python3 "${GITHUB_WORKSPACE}/cicd-packaging-source/.github/scripts/tests/resolve-desktop-release-test.py"

      - name: Validate trusted update key configuration
        env:
          CHAT2DB_UPDATE_KEY_ID: ${{ secrets.CHAT2DB_UPDATE_KEY_ID }}
          CHAT2DB_UPDATE_PUBLIC_KEY_B64: ${{ secrets.CHAT2DB_UPDATE_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "${CHAT2DB_UPDATE_KEY_ID}"
          test -n "${CHAT2DB_UPDATE_PUBLIC_KEY_B64}"

      - name: Test macOS signing helper
        shell: bash
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/cicd-packaging-source/.github/scripts/tests/sign-macos-native-libraries-test.sh"

  notify_start:
    name: Notify Feishu release start
    runs-on: ubuntu-latest
    steps:
      - name: Send Feishu start notification
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_NOTIFY_WEBHOOK }}
          RELEASE_EDITION: Chat2DB Local
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || secrets.REPO_BRANCH }}
          UPLOAD_LATEST: ${{ github.event.inputs.upload_latest }}
          UPDATE_LATEST_VERSION_JSON: ${{ github.event.inputs.update_latest_version_json }}
          RELEASE_CHANNEL: ${{ github.event.inputs.channel }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_RELEASE_NOTIFY_WEBHOOK is not configured; skip start notification."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          lines = [
              f"{os.environ['RELEASE_EDITION']} 灰度打包已开始",
              f"版本：{os.environ['RELEASE_VERSION']}",
              f"源码分支：{os.environ['SOURCE_REF']}",
              f"upload_latest：{os.environ['UPLOAD_LATEST']}",
              f"update_latest_version_json：{os.environ['UPDATE_LATEST_VERSION_JSON']}",
              f"channel：{os.environ['RELEASE_CHANNEL']}",
              f"运行链接：{os.environ['RUN_URL']}",
          ]
          payload = json.dumps(
              {"msg_type": "text", "content": {"text": "\n".join(lines)}},
              ensure_ascii=False,
          ).encode("utf-8")
          request = urllib.request.Request(
              os.environ["FEISHU_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(response.read().decode("utf-8"))
          except urllib.error.URLError as exc:
              print(f"::warning::Feishu start notification failed: {exc}")
          PY

  release:
    needs: resolve_source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            update_target: macos-x64
            update_platform: MACOS
            update_arch: X64
            file_name: 'latest.dmg'
            file_extension: '-x64.dmg'
            build_arg: '--mac --x64'
          - os: windows-latest
            arch: x86_64
            update_target: windows-x64
            update_platform: WINDOWS
            update_arch: X64
            file_extension: '.exe'
            file_name: 'latest.exe'
            build_arg: '--win --x64'
          - os: macos-15
            arch: arm64
            update_target: macos-arm64
            update_platform: MACOS
            update_arch: ARM64
            file_name: 'arm64-latest.dmg'
            file_extension: '-arm64.dmg'
            build_arg: '--mac --arm64'
          - os: ubuntu-22.04
            arch: x86_64
            update_target: linux-x64
            update_platform: LINUX
            update_arch: X64
            file_name: 'latest.AppImage'
            file_extension: '-x86_64.AppImage'
            build_arg: '--linux --x64'
          - os: ubuntu-22.04-arm
            arch: arm64
            update_target: linux-arm64
            update_platform: LINUX
            update_arch: ARM64
            file_name: 'arm64-latest.AppImage'
            file_extension: '-arm64.AppImage'
            build_arg: '--linux --arm64'

    runs-on: ${{ matrix.os }}

    env:
      JCEF_PROJECT_ROOT: ${{ github.workspace }}/${{ secrets.REPO_PATH }}
      JCEF_PACKAGE_SCRIPT_DIR: ${{ github.workspace }}/${{ secrets.REPO_PATH }}/script/package
      JCEF_SOURCE_REF: ${{ github.event.inputs.source_ref || secrets.REPO_BRANCH }}
      JCEF_ENTERPRISE_SOURCE_REF: ${{ needs.resolve_source.outputs.enterprise_sha }}
      JCEF_COMMUNITY_REPOSITORY: OtterMind/Chat2DB
      JCEF_COMMUNITY_SOURCE_REF: ${{ needs.resolve_source.outputs.community_sha }}
      JCEF_COMMUNITY_ROOT: ${{ github.workspace }}/chat2db-community-source
      JCEF_COMMUNITY_CLIENT_ROOT: ${{ github.workspace }}/chat2db-community-source/chat2db-community-client
      JCEF_COMMUNITY_POM_PATH: ${{ github.workspace }}/chat2db-community-source/chat2db-community-server/pom.xml
      JCEF_FRONT_PATH: ${{ github.workspace }}/${{ secrets.REPO_PATH }}/chat2db-studio-client
      JCEF_FRONTEND_SRC_ROOT: ${{ github.workspace }}/chat2db-community-source/chat2db-community-client/src
      JCEF_PRODUCT_CONFIG: ${{ github.workspace }}/${{ secrets.REPO_PATH }}/chat2db-studio-client/product.studio.ts
      JCEF_YARN_LOCK_PATH: ${{ github.workspace }}/${{ secrets.REPO_PATH }}/chat2db-studio-client/yarn.lock
      JCEF_POM_PATH: ${{ github.workspace }}/${{ secrets.REPO_PATH }}/chat2db-studio-server/pom.xml
      JCEF_STATIC_PATH: ${{ github.workspace }}/${{ secrets.REPO_PATH }}/chat2db-studio-client/static
      JCEF_JRE_PATH: ${{ github.workspace }}/${{ secrets.REPO_PATH }}/chat2db-studio-client/static/jre
      CHAT2DB_FRONTEND_SRC_ROOT: ${{ github.workspace }}/chat2db-community-source/chat2db-community-client/src
      CHAT2DB_PRODUCT_CONFIG: ${{ github.workspace }}/${{ secrets.REPO_PATH }}/chat2db-studio-client/product.studio.ts
      CHAT2DB_RELEASE_EPOCH: ${{ github.event.inputs.release_epoch }}
      CHAT2DB_RELEASE_NOTES_URL: ${{ github.event.inputs.release_notes_url }}
      CHAT2DB_UPDATE_KEY_ID: ${{ secrets.CHAT2DB_UPDATE_KEY_ID }}
      CHAT2DB_UPDATE_PUBLIC_KEY_B64: ${{ secrets.CHAT2DB_UPDATE_PUBLIC_KEY_B64 }}
      CHAT2DB_MAVEN_PROFILE: ${{ needs.resolve_source.outputs.release_profile }}
      CHAT2DB_RELEASE_CHANNEL: ${{ needs.resolve_source.outputs.release_channel_upper }}

    # 将release_test分支的代码检出（即复制）到 GitHub Actions 的运行环境中。
    steps:
      - name: Check out second repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REPO_URL }}
          path: ${{ secrets.REPO_PATH }}
          ref: ${{ needs.resolve_source.outputs.enterprise_sha }}
          token: ${{ secrets.ACCESS_TOKEN }}
          persist-credentials: false

      - name: Check out community repository
        uses: actions/checkout@v4
        with:
          repository: OtterMind/Chat2DB
          path: chat2db-community-source
          ref: ${{ needs.resolve_source.outputs.community_sha }}
          persist-credentials: false

      - name: Check out CI packaging helpers
        if: runner.os == 'macOS'
        uses: actions/checkout@v4
        with:
          path: cicd-packaging-source
          ref: ${{ github.sha }}
          persist-credentials: false

      # Output basic information
      - name: Print basic information
        run: |
          echo "current version: ${{ github.run_id }}"
          echo "source ref: ${JCEF_SOURCE_REF}"
          echo "enterprise resolved SHA: ${JCEF_ENTERPRISE_SOURCE_REF}"
          echo "community repository: ${JCEF_COMMUNITY_REPOSITORY}"
          echo "community resolved SHA: ${JCEF_COMMUNITY_SOURCE_REF}"
          git -C "${{ env.JCEF_PROJECT_ROOT }}" rev-parse --abbrev-ref HEAD || true
          git -C "${{ env.JCEF_PROJECT_ROOT }}" rev-parse HEAD
          git -C "${{ env.JCEF_COMMUNITY_ROOT }}" rev-parse --abbrev-ref HEAD || true
          git -C "${{ env.JCEF_COMMUNITY_ROOT }}" rev-parse HEAD

      - name: Validate packaging paths
        shell: bash
        run: |
          set -euo pipefail
          test -d "${JCEF_PROJECT_ROOT}"
          test -d "${JCEF_FRONT_PATH}"
          test -f "${JCEF_YARN_LOCK_PATH}"
          test -f "${JCEF_POM_PATH}"
          test -d "${JCEF_PACKAGE_SCRIPT_DIR}"
          test -d "${JCEF_COMMUNITY_ROOT}"
          test -d "${JCEF_COMMUNITY_CLIENT_ROOT}"
          test -d "${JCEF_FRONTEND_SRC_ROOT}"
          test -f "${JCEF_FRONTEND_SRC_ROOT}/utils/package.ts"
          test -f "${JCEF_COMMUNITY_POM_PATH}"
          test -f "${JCEF_PRODUCT_CONFIG}"
          test -f "${JCEF_FRONT_PATH}/scripts/prepare-frontend-source.js"
          if [ -L "${JCEF_FRONT_PATH}/src" ]; then
            rm "${JCEF_FRONT_PATH}/src"
          elif [ -e "${JCEF_FRONT_PATH}/src" ]; then
            echo "::error::chat2db-studio-client/src must not be a real directory"
            exit 1
          fi

      - name: Create Feishu package notification helper
        shell: python
        run: |
          import os
          from pathlib import Path

          script = r'''
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          webhook = os.environ.get("FEISHU_WEBHOOK_URL", "")
          if not webhook:
              print("FEISHU_RELEASE_NOTIFY_WEBHOOK is not configured; skip package notification.")
              sys.exit(0)

          edition = os.environ.get("PACKAGE_EDITION", "Chat2DB")
          version = os.environ.get("PACKAGE_VERSION", "")
          platform = os.environ.get("PACKAGE_PLATFORM", "")
          package_name = os.environ.get("PACKAGE_NAME", "")
          package_url = os.environ.get("PACKAGE_URL", "")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = f"https://github.com/{repository}/actions/runs/{run_id}" if repository and run_id else ""

          text = "\n".join([
              f"{edition} 灰度包上传成功",
              f"版本：{version}",
              f"平台：{platform}",
              f"包名：{package_name}",
              f"下载链接：{package_url}",
              f"运行链接：{run_url}",
          ])
          payload = json.dumps({"msg_type": "text", "content": {"text": text}}, ensure_ascii=False).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(response.read().decode("utf-8"))
          except urllib.error.URLError as exc:
              print(f"::warning::Feishu package notification failed: {exc}")
          '''

          Path(os.environ["RUNNER_TEMP"], "notify_package.py").write_text(script, encoding="utf-8")
      

      # =================================================================
      # 【第一阶段】准备环境：下载 JBR 并安装 Temurin JDK
      # =================================================================
      - name: Setup Custom JBR (for Build and Runtime Image)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Downloading and extracting JBR to be used for compilation and as the runtime image..."
          curl.exe -L -o jbr.tar.gz "https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-17.0.12-windows-x64-b1207.37.tar.gz"
          New-Item -Path "jbr-for-build" -ItemType Directory -Force
          tar.exe -xzf jbr.tar.gz -C jbr-for-build --strip-components=1
          
          # 将 JBR 的路径保存到一个环境变量中，供后续步骤使用
          $jbrPath = Resolve-Path -Path "jbr-for-build"
          echo "JBR_BUILD_PATH=$jbrPath" >> $env:GITHUB_ENV
          Write-Host "JBR for compilation is ready at: $jbrPath"

      - name: Setup Custom OpenJDK and Set Unique Environment Variable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Downloading and extracting custom OpenJDK..."
          
          # 1. 定义下载地址和目标文件名
          $url = "https://download.java.net/java/GA/jdk17.0.2/dfd4a8d0985749f896bed50d7138ee7f/8/GPL/openjdk-17.0.2_windows-x64_bin.zip"
          $outputFile = "openjdk.zip"
          $extractDir = "openjdk-custom"

          # 2. 下载并解压
          curl.exe -L -o $outputFile "$url"
          New-Item -Path $extractDir -ItemType Directory -Force
          7z.exe x $outputFile -o"$extractDir" -y

          # 3. 动态获取解压后的 JDK 主目录路径
          $jdkHome = Get-ChildItem -Path $extractDir | Select-Object -First 1 | ForEach-Object { $_.FullName }
          Write-Host "Resolved OpenJDK home path: $jdkHome"

          # 4. 【已修改】将路径保存到一个唯一的环境变量中，而不是直接设置 JAVA_HOME
          echo "OPENJDK_PATH=$jdkHome" >> $env:GITHUB_ENV
          Write-Host "Custom OpenJDK path saved to OPENJDK_PATH for subsequent steps."      

      # =================================================================
      # 【第一阶段】准备环境：将 JBR 设置为默认，并安装好 Temurin
      # =================================================================
      - name: Setup Custom JBR as Default JAVA_HOME
        if: runner.os == 'macOS'
        run: |
          # 根据 matrix.arch 动态选择要下载的 JBR URL
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            JBR_URL="https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-17.0.12-osx-aarch64-b1207.37.tar.gz"
          else
            JBR_URL="https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-17.0.12-osx-x64-b1207.37.tar.gz"
          fi
          
          echo "Downloading JBR for ${{ matrix.arch }}..."
          curl -L -o jbr.tar.gz "$JBR_URL"
          mkdir -p jbr-default
          tar -xzf jbr.tar.gz -C jbr-default --strip-components=1
          
          # 获取 JBR 的绝对路径并设置为默认的 JAVA_HOME
          JBR_HOME_PATH=$(cd jbr-default/Contents/Home && pwd)
          echo "Setting default JAVA_HOME to JBR: $JBR_HOME_PATH"
          echo "JAVA_HOME=$JBR_HOME_PATH" >> "$GITHUB_ENV"
          echo "$JBR_HOME_PATH/bin" >> "$GITHUB_PATH"
          
          
