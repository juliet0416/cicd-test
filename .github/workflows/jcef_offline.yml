          #     mkdir -p jbr-17
          #     tar -xzf jbr.tar.gz -C jbr-17 --strip-components=1
          
          #     # --------------------- 核心配置步骤 (已根据最终路径 jbr-17/Contents/Home 修正) ---------------------
