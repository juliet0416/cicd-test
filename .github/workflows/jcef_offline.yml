          #     echo "Configuration complete."    
          
          # - name: Verify Final Java Configuration
          #   if: ${{ runner.os == 'macOS'}}
          #   run: |
          #     echo "--- Verifying final configuration ---"
          
          #     # 1. 检查 JAVA_HOME
          #     echo "JAVA_HOME is: $JAVA_HOME"
          
          #     # 2. 检查 'java' 命令的指向
          #     WHICH_JAVA=$(which java)
          #     echo "'which java' points to: $WHICH_JAVA"
          
          #     # 3. 检查 Java 版本
